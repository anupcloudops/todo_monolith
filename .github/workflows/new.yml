name: test pipeline
on:
  workflow_dispatch
jobs:
  hello:
    runs-on: self-hosted
    steps:
      - name: hello-step
        run: echo "JAI JAGNNATH"
      - name: variable check
        run: echo "${{ github.actor }}"
      - name: code Checkout
        run: actions/checkout@v4
      - name: install node Node.js
        uses: actions/setup-node
        with:
          node-version: 16
      - name: run node commands
        run: |
          npm install
          npm run build