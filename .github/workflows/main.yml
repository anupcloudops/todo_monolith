name: read file
on:
  workflow_dispatch:
   
jobs:
  fileread:
    runs-on: self-hosted
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: read file
        run: cat azure-pipelines.yml
      - name: context variable
        run: |
          echo "this work flow is ${{ github.actor }}"
          echo "this work flow is ${{ github.repository }}"
          echo "this work flow is ${{ github.ref_name }}"
          echo "this work flow is ${{ tojson(github) }}"
          echo "$GITHUB_SHA"
